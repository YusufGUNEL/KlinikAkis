# Backend derleme + test, Angular derleme + test (SPEC §3, §13.9).
# Sır gerekmez: testler Fake AI sağlayıcısı ve SQLite ile çalışır; PrimeUI lisansı yoksa derleme yalnızca uyarı verir.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: .NET derleme ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    name: Angular derleme ve test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --no-watch --no-progress
